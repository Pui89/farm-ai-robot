<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Farm AI Robot in Orchard</title>
  <desc id="desc">Cartoon agricultural robot monitoring a flooded orchard with trees, workers, and a warning sign.</desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff7ff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#a7d77a"/>
      <stop offset="100%" stop-color="#6fbf56"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#72d1ff"/>
      <stop offset="100%" stop-color="#1a8fd6"/>
    </linearGradient>
    <linearGradient id="robotGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#4d8bff"/>
      <stop offset="100%" stop-color="#253a8d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d2334" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1280" cy="120" r="58" fill="#ffd761" opacity="0.92"/>
  <circle cx="1280" cy="120" r="88" fill="#ffd761" opacity="0.16"/>

  <!-- Orchard rows -->
  <g opacity="0.98">
    <path d="M0 620 L1600 620 L1600 900 L0 900 Z" fill="url(#ground)"/>
    <g stroke="#6aa04b" stroke-width="10" opacity="0.7">
      <path d="M0 650 L1600 650"/>
      <path d="M0 710 L1600 710"/>
      <path d="M0 770 L1600 770"/>
    </g>
  </g>

  <!-- Tree rows -->
  <g>
    <g transform="translate(80 0)">
      <circle cx="100" cy="480" r="46" fill="#4cab5c"/>
      <circle cx="150" cy="450" r="48" fill="#58b864"/>
      <circle cx="200" cy="480" r="50" fill="#4cab5c"/>
      <rect x="148" y="510" width="20" height="90" fill="#7d5630"/>
      <rect x="110" y="520" width="18" height="75" fill="#7d5630"/>
      <rect x="188" y="520" width="18" height="75" fill="#7d5630"/>
    </g>
    <g transform="translate(340 0)">
      <circle cx="100" cy="470" r="46" fill="#4cab5c"/>
      <circle cx="150" cy="440" r="48" fill="#58b864"/>
      <circle cx="200" cy="470" r="50" fill="#4cab5c"/>
      <rect x="148" y="500" width="20" height="92" fill="#7d5630"/>
      <rect x="110" y="510" width="18" height="80" fill="#7d5630"/>
      <rect x="188" y="510" width="18" height="80" fill="#7d5630"/>
    </g>
    <g transform="translate(600 0)">
      <circle cx="100" cy="490" r="46" fill="#4cab5c"/>
      <circle cx="150" cy="455" r="49" fill="#58b864"/>
      <circle cx="200" cy="490" r="50" fill="#4cab5c"/>
      <rect x="148" y="525" width="20" height="85" fill="#7d5630"/>
      <rect x="110" y="535" width="18" height="75" fill="#7d5630"/>
      <rect x="188" y="535" width="18" height="75" fill="#7d5630"/>
    </g>
    <g transform="translate(860 0)">
      <circle cx="100" cy="470" r="46" fill="#4cab5c"/>
      <circle cx="150" cy="440" r="48" fill="#58b864"/>
      <circle cx="200" cy="470" r="50" fill="#4cab5c"/>
      <rect x="148" y="500" width="20" height="98" fill="#7d5630"/>
      <rect x="110" y="510" width="18" height="86" fill="#7d5630"/>
      <rect x="188" y="510" width="18" height="86" fill="#7d5630"/>
    </g>
    <g transform="translate(1120 0)">
      <circle cx="100" cy="485" r="46" fill="#4cab5c"/>
      <circle cx="150" cy="455" r="50" fill="#58b864"/>
      <circle cx="200" cy="485" r="50" fill="#4cab5c"/>
      <rect x="148" y="520" width="20" height="88" fill="#7d5630"/>
      <rect x="110" y="530" width="18" height="75" fill="#7d5630"/>
      <rect x="188" y="530" width="18" height="75" fill="#7d5630"/>
    </g>
  </g>

  <!-- Flooded low area -->
  <g>
    <path d="M780 660 C860 630, 940 628, 1030 650 L1030 820 L700 820 L700 700 C720 680, 740 670, 780 660 Z" fill="url(#water)" opacity="0.85"/>
    <g stroke="#d9f5ff" stroke-width="4" opacity="0.8">
      <path d="M720 700 C790 690, 860 695, 930 710" fill="none"/>
      <path d="M760 730 C840 720, 890 730, 1010 750" fill="none"/>
      <path d="M725 780 C820 772, 900 782, 1005 800" fill="none"/>
    </g>
  </g>

  <!-- Warning symbol -->
  <g transform="translate(1210 250)">
    <path d="M0 0 L82 0 L41 78 Z" fill="#f7c948"/>
    <circle cx="41" cy="28" r="8" fill="#874d00"/>
    <rect x="36" y="38" width="10" height="22" rx="4" fill="#874d00"/>
  </g>

  <!-- Robot -->
  <g filter="url(#shadow)" transform="translate(350 280)">
    <rect x="0" y="180" width="180" height="100" rx="18" fill="url(#robotGrad)"/>
    <rect x="35" y="125" width="110" height="70" rx="14" fill="#dfefff"/>
    <rect x="52" y="140" width="76" height="28" rx="10" fill="#9bc6ff"/>
    <circle cx="45" cy="330" r="28" fill="#1d2c34"/>
    <circle cx="135" cy="330" r="28" fill="#1d2c34"/>
    <circle cx="45" cy="330" r="12" fill="#8cf3ff"/>
    <circle cx="135" cy="330" r="12" fill="#8cf3ff"/>
    <rect x="180" y="200" width="26" height="58" rx="10" fill="#6dc8ff"/>
    <rect x="-28" y="200" width="26" height="58" rx="10" fill="#6dc8ff"/>
    <rect x="70" y="100" width="42" height="18" rx="8" fill="#dfefff" opacity="0.8"/>
    <circle cx="90" cy="86" r="16" fill="#f9d66a"/>
    <circle cx="90" cy="86" r="8" fill="#563a09"/>
    <rect x="64" y="60" width="52" height="20" rx="10" fill="#dfefff"/>
    <rect x="72" y="0" width="36" height="36" rx="10" fill="#e7f4ff"/>
    <rect x="80" y="36" width="18" height="18" rx="5" fill="#5bb0ff"/>
  </g>

  <!-- Worker -->
  <g transform="translate(1030 520)">
    <circle cx="40" cy="30" r="18" fill="#f1c27d"/>
    <rect x="20" y="48" width="40" height="62" rx="16" fill="#3f6ce6"/>
    <rect x="12" y="62" width="16" height="60" rx="8" fill="#f1c27d"/>
    <rect x="52" y="62" width="16" height="60" rx="8" fill="#f1c27d"/>
    <rect x="18" y="108" width="18" height="56" rx="8" fill="#5475ff"/>
    <rect x="42" y="108" width="18" height="56" rx="8" fill="#5475ff"/>
    <rect x="34" y="30" width="60" height="11" rx="5" fill="#7a4d20"/>
  </g>

  <!-- Additional worker -->
  <g transform="translate(1110 610)">
    <circle cx="30" cy="18" r="14" fill="#f0c596"/>
    <rect x="14" y="34" width="30" height="42" rx="12" fill="#e0b44d"/>
    <rect x="22" y="42" width="10" height="44" rx="6" fill="#f1d7ae"/>
    <rect x="34" y="42" width="10" height="44" rx="6" fill="#f1d7ae"/>
    <rect x="16" y="74" width="12" height="42" rx="6" fill="#2b57a7"/>
    <rect x="30" y="74" width="12" height="42" rx="6" fill="#2b57a7"/>
  </g>

  <!-- Safe route arrow -->
  <g transform="translate(1215 530)">
    <path d="M0 0 L130 0 L130 -18 L170 18 L130 54 L130 36 L0 36 Z" fill="#48bc67" opacity="0.9"/>
    <text x="18" y="26" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">SAFE</text>
  </g>

  <!-- Floating info panel -->
  <g transform="translate(60 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="170" rx="18" fill="#ffffff" opacity="0.9"/>
    <text x="28" y="46" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d3d">Farm AI Robot</text>
    <text x="28" y="82" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#2d7dff">Flood Risk: CRITICAL</text>
    <text x="28" y="116" font-family="Arial, sans-serif" font-size="20" fill="#3d4d5f">Rows 7–10: Standing water</text>
    <text x="28" y="145" font-family="Arial, sans-serif" font-size="20" fill="#3d4d5f">Drain blocked — move workers to safe route</text>
  </g>

  <!-- Decorative clouds -->
  <g fill="#ffffff" opacity="0.82">
    <circle cx="180" cy="120" r="22"/>
    <circle cx="205" cy="110" r="18"/>
    <circle cx="230" cy="120" r="24"/>
    <circle cx="520" cy="150" r="24"/>
    <circle cx="548" cy="140" r="20"/>
    <circle cx="578" cy="150" r="26"/>
  </g>
</svg>
