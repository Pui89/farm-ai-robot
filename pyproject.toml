[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-ai-robot"
version = "0.1.0"
description = "AI-powered orchard and farm robot starter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.7.0",
  "numpy>=1.23.0",
  "opencv-python>=4.9.0",
  "ultralytics>=8.2.0",
  "requests>=2.31.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
